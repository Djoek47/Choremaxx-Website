<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm your email · ChoreMaxx</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#FBF4EE;--card:#fff;--ink:#1E1611;--muted:#7B6C62;--line:#EADDD2;--coral:#D85A30;--coral-d:#A8411F;--good:#1F8A6B}
@media (prefers-color-scheme:dark){:root{--bg:#140C08;--card:#22160F;--ink:#F6EEE8;--muted:#A8968A;--line:#3A2A20;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(600px 380px at 10% 0%,#D85A3033,transparent 60%),radial-gradient(500px 340px at 95% 40%,#FAC77533,transparent 60%),var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 26px;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px -30px #0005}
img{width:72px;height:72px;border-radius:18px;margin:0 auto}
h1{margin:4px 0 0;font-size:28px;letter-spacing:-.6px}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.45}
.btn{display:block;text-decoration:none;border-radius:18px;padding:16px;font-weight:700;font-size:17px;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--coral);margin:6px auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ok{color:var(--good)}
small{color:var(--muted)}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <img src="/assets/logo.png" alt="ChoreMaxx">
  <h1 id="title">Confirming your email…</h1>
  <div class="spin" id="spin"></div>
  <p id="text">One moment.</p>
  <a class="btn" id="open" href="choremaxx://auth/callback?confirmed=1" hidden>Open ChoreMaxx</a>
  <small id="foot" hidden>Not opening? Open ChoreMaxx on this phone and tap “Already confirmed”.</small>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const cfg = window.CHOREMAXX || {};
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));
  const tokenHash = params.get('token_hash');
  const type = params.get('type') || 'email';
  const done = (title, text, ok) => {
    $('spin').hidden = true;
    $('title').textContent = title;
    $('title').className = ok ? 'ok' : '';
    $('text').textContent = text;
    $('open').hidden = false;
    $('foot').hidden = false;
    // Try to hand off to the app right away on phones (Safari opens it; Chrome needs the tap).
    if (ok && /iPhone|iPad|Android/i.test(navigator.userAgent)) setTimeout(() => { location.href = $('open').href; }, 600);
  };
  const errText = (params.get('error_description') || hash.get('error_description') || '').toLowerCase();
  if (errText) {
    return done('This link was already used', 'If you already confirmed, you are all set. Open ChoreMaxx to continue.', false);
  }
  if (!tokenHash) {
    return done('Open ChoreMaxx to continue', 'If you just confirmed your email, the app will pick it up.', false);
  }
  try {
    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: false, detectSessionInUrl: false } });
    const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type });
    if (!error) return done('Email confirmed', 'Your account is ready. Open ChoreMaxx to set up your household.', true);
    const msg = `${error.code || ''} ${error.message || ''}`.toLowerCase();
    if (msg.includes('expired') || msg.includes('invalid') || msg.includes('used')) {
      return done('This link was already used', 'If you already confirmed, you are all set. Otherwise open the app and send a new code.', false);
    }
    done('We could not confirm this link', 'Open ChoreMaxx and enter the code from the same email instead.', false);
  } catch (e) {
    done('We could not confirm this link', 'Open ChoreMaxx and enter the code from the same email instead.', false);
  }
})();
</script>
</body>
</html>

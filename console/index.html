<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ChoreMaxx Console</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>


<!-- Sign-in: a magic link to an allow-listed staff address. Shown first; the demo signs straight in. -->
<section id="signin">
  <form class="signin-card" id="signin-form" novalidate>
    <div class="brand"><div class="brand-mark logo" aria-hidden="true"><img src="/logo.png" alt=""/></div><div class="brand-name">chore<span>maxx</span> console</div></div>
    <div>
      <h1 style="font-size:26px;font-weight:800">Sign in to support</h1>
      <p class="hint" style="margin:6px 0 0">Staff only. We email you a one-time link — no password to remember.</p>
    </div>
    <div class="field"><label for="email">Work email</label><input class="input" id="email" type="email" placeholder="you@choremaxx.app" autocomplete="email" ></div>
    <button class="btn" type="submit">Email me a sign-in link</button>
    <p class="hint" id="signin-note" style="margin:0" aria-live="polite">Only addresses on the staff list can sign in.</p>
  </form>
</section>

<div id="app" hidden>
  <aside class="rail">
    <div class="brand"><div class="brand-mark logo" aria-hidden="true"><img src="/logo.png" alt=""/></div><div class="brand-name">chore<span>maxx</span></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="rail-foot">
      <div class="privacy">
        <div><strong style="color:var(--fg)">Show names</strong><br><span id="privacy-hint">Off — households are codes</span></div>
        <button class="switch" id="privacy" role="switch" aria-checked="false" aria-label="Show household names"></button>
      </div>
      <div class="who">Signed in as <strong id="who">support@choremaxx.app</strong></div>
      <button class="btn ghost small" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="view-title">Overview</h1><div class="sub" id="view-sub"></div></div>
      <div class="grow"></div>
      <span class="example" id="live-dot" style="color:var(--good);background:var(--good-soft)">Live</span>
      <input class="input search" id="search" type="search" placeholder="Search code, ticket, email…" aria-label="Search">
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="layer"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
